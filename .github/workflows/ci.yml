name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-skills:
    name: Validate Skills Ecosystem (19 AgentSkills)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Run Skills Validator
        run: python scripts/validate_skills.py

  typescript-ci:
    name: TypeScript & Node.js CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Build and test TypeScript
        run: |
          npm ci
          npm run build
          npm test

  rust-ci:
    name: Rust Sandbox Kernel & Daemon CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "sandbox_runtime -> target"

      - name: Check, test, lint and format Rust workspace
        run: |
          cd sandbox_runtime
          cargo check --workspace --all-targets
          cargo test --workspace
          cargo clippy --workspace --all-targets -- -D warnings
          cargo fmt --all -- --check

  docker-sandbox-roundtrip:
    name: Docker Sandbox Live Roundtrip
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Build real sandbox image
        run: docker build -t security-audit-sandbox:latest sandbox_runtime

      - name: Run authenticated host-to-sandbox integration test
        env:
          SECURITY_AUDIT_DOCKER_E2E: "1"
        run: npx vitest run tests/docker_roundtrip.test.ts

      - name: Cleanup sandbox container
        if: always()
        run: docker rm -f security-audit-sandbox >/dev/null 2>&1 || true
