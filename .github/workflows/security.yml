name: Security & Secret Scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1" # Weekly Monday morning audit

permissions:
  contents: read

jobs:
  gitleaks-scan:
    name: Gitleaks Secret & Token Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  dependency-audit:
    name: Open Source Dependency Audit (SCA)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Audit NPM Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm audit --audit-level=high || true
          else
            echo "No package-lock.json found yet."
          fi

      - name: Audit Cargo Dependencies
        run: |
          if [ -f sandbox_runtime/Cargo.lock ] || [ -f Cargo.lock ]; then
            cargo install cargo-audit --locked || true
            cargo audit || true
          else
            echo "No Cargo.lock found yet."
          fi
