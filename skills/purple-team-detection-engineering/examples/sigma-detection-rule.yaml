title: Suspicious PowerShell Download Cradle Execution
id: 3c8e4f12-1234-4567-89ab-cdef01234567
status: stable
description: Detects suspicious PowerShell commands initiating web requests to download and execute scripts in memory.
references:
  - https://attack.mitre.org/techniques/T1059.001/
author: Security Audit Plugin
date: 2026-09-01
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
  selection_cli:
    CommandLine|contains|all:
      - 'DownloadString'
      - 'IEX'
  condition: selection_img and selection_cli
falsepositives:
  - Authorized administrative software deployment scripts
level: high
tags:
  - attack.execution
  - attack.t1059.001
